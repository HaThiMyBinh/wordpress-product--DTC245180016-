global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: wordpress-product
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://192.168.101.128:8443"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 172.27.0.3:9115

  - job_name: cadvisor
    static_configs:
      - targets: ["172.27.0.4:8080"]
